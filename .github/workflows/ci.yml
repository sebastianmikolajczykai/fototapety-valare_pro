# CI: formatowanie, lint, typy, testy z pokryciem. Bez wdrożenia (hosting nie jest jeszcze wybrany).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatowanie (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typy (TypeScript strict)
        run: npm run typecheck
      - name: Testy + pokrycie (min. 80% linii, 70% gałęzi)
        run: npm run test:coverage

  # Strona w przeglądarce (Chromium) na zbudowanym serwerze – po scaleniu na main (uwaga recenzenta do PR #2).
  # Porównanie ze starym programem wymaga OLD_REPO (lokalnie), tu jest pomijane.
  e2e:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Przeglądarka Chromium (Playwright 1.63.0)
        run: npx playwright install --with-deps chromium
      - name: Testy e2e
        run: npm run test:e2e
