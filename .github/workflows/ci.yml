# CI: formatowanie, lint, typy, testy z pokryciem. Bez wdrożenia (hosting nie jest jeszcze wybrany).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatowanie (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typy (TypeScript strict)
        run: npm run typecheck
      - name: Testy + pokrycie (min. 80% linii, 70% gałęzi)
        run: npm run test:coverage

  # Strona w przeglądarce (Chromium) na zbudowanym serwerze – przy każdym PR i po scaleniu na main.
  # Porównanie ze starym programem (fototapety-valare @ 6933982) działa, gdy w GitHub Secrets jest OLD_REPO_TOKEN
  # (token tylko do odczytu tego repo). Bez tokena testy porównawcze są pomijane, a reszta e2e działa.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OLD_REPO_TOKEN: ${{ secrets.OLD_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Stary program do porównania (tylko odczyt)
        if: env.OLD_REPO_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: sebastianmikolajczykai/fototapety-valare
          ref: 6933982602cfdaae2b64f5a1b26c15793702ab5f
          token: ${{ secrets.OLD_REPO_TOKEN }}
          path: old-repo
          persist-credentials: false
      - name: Ścieżka starego programu dla testów
        if: env.OLD_REPO_TOKEN != ''
        run: echo "OLD_REPO=$GITHUB_WORKSPACE/old-repo" >> "$GITHUB_ENV"
      - name: Brak tokena – porównanie ze starym programem pominięte
        if: env.OLD_REPO_TOKEN == ''
        run: echo "::warning::Brak sekretu OLD_REPO_TOKEN – testy porównawcze stary vs nowy są pominięte."
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Przeglądarka Chromium (Playwright 1.63.0)
        run: npx playwright install --with-deps chromium
      - name: Testy e2e
        run: npm run test:e2e
