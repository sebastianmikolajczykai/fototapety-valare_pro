# CI: formatowanie, lint, typy, testy z pokryciem. Bez wdrożenia (hosting nie jest jeszcze wybrany).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Formatowanie (Prettier)
        run: npm run format:check
      - name: Lint (ESLint)
        run: npm run lint
      - name: Typy (TypeScript strict)
        run: npm run typecheck
      - name: Testy + pokrycie (min. 80% linii, 70% gałęzi)
        run: npm run test:coverage
